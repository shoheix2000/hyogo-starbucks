const STORAGE_KEY = 'hyogo-starbucks-records';

// ---------- ãã¼ã¿ç®¡ç ----------
function makeId(s) { return `${s.city}|${s.name}`; }

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}

function saveRecords(records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function buildStores(records) {
  const result = INITIAL_STORES.map(s => ({
    id: makeId(s), name: s.name, city: s.city, address: s.address,
    visited: false, visitDate: '', note: '', isCustom: false,
    ...( records[makeId(s)] || {} )
  }));
  Object.entries(records).forEach(([id, rec]) => {
    if (rec.isCustom) result.push({ id, ...rec });
  });
  return result;
}

function toRecords(stores) {
  const r = {};
  stores.forEach(s => {
    if (s.isCustom) {
      r[s.id] = { name:s.name, city:s.city, address:s.address,
                   visited:s.visited, visitDate:s.visitDate, note:s.note, isCustom:true };
    } else if (s.visited || s.visitDate || s.note) {
      r[s.id] = { visited:s.visited, visitDate:s.visitDate, note:s.note };
    }
  });
  return r;
}

// ---------- ç¶æ ----------
let stores = buildStores(loadRecords());
let currentFilter = 'all';
let currentCity = 'all';
let currentSearch = '';
let collapsedCities = {};

function persist() { saveRecords(toRecords(stores)); }

// ---------- ãã£ã«ã¿ ----------
function getFiltered() {
  return stores.filter(s => {
    if (currentCity !== 'all' && s.city !== currentCity) return false;
    if (currentFilter === 'visited' && !s.visited) return false;
    if (currentFilter === 'unvisited' && s.visited) return false;
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      return s.name.toLowerCase().includes(q) ||
             s.city.toLowerCase().includes(q) ||
             (s.address||'').toLowerCase().includes(q) ||
             (s.note||'').toLowerCase().includes(q);
    }
    return true;
  });
}

function groupByCity(list) {
  const m = new Map();
  list.forEach(s => {
    if (!m.has(s.city)) m.set(s.city, []);
    m.get(s.city).push(s);
  });
  return Array.from(m.entries()).sort((a, b) => {
    const ai = CITY_ORDER.indexOf(a[0]), bi = CITY_ORDER.indexOf(b[0]);
    if (ai===-1&&bi===-1) return a[0].localeCompare(b[0],'ja');
    if (ai===-1) return 1; if (bi===-1) return -1;
    return ai - bi;
  });
}

function updateHeader() {
  const total = stores.length;
  const visited = stores.filter(s => s.visited).length;
  const pct = total ? Math.round(visited / total * 100) : 0;
  document.getElementById('h-visited').innerHTML = `${visited}<span> / <span id="h-total">${total}</span></span>`;
  document.getElementById('h-pct').textContent = `${pct}% éæ`;
  document.getElementById('progress-fill').style.width = pct + '%';

  const filtered = getFiltered();
  const fVisited = filtered.filter(s=>s.visited).length;
  const fUnvisited = filtered.filter(s=>!s.visited).length;
  document.getElementById('cnt-all').textContent = `(${filtered.length})`;
  document.getElementById('cnt-visited').textContent = `(${fVisited})`;
  document.getElementById('cnt-unvisited').textContent = `(${fUnvisited})`;
}

// ---------- å¸çºæã»ã¬ã¯ãæ´æ° ----------
function updateCitySelect() {
  const sel = document.getElementById('city-select');
  const cities = [...new Set(stores.map(s=>s.city))].sort((a,b)=>{
    const ai=CITY_ORDER.indexOf(a),bi=CITY_ORDER.indexOf(b);
    if(ai===-1&&bi===-1) return a.localeCompare(b,'ja');
    if(ai===-1) return 1; if(bi===-1) return -1; return ai-bi;
  });
  const prev = sel.value;
  sel.innerHTML = '<option value="all">å¸çºæ: ãã¹ã¦</option>';
  const dl = document.getElementById('city-list');
  dl.innerHTML = '';
  cities.forEach(c => {
    const t = stores.filter(s=>s.city===c);
    const v = t.filter(s=>s.visited).length;
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = `${c} (${v}/${t.length})`;
    sel.appendChild(opt);
    const dopt = document.createElement('option');
    dopt.value = c; dl.appendChild(dopt);
  });
  sel.value = cities.includes(prev) ? prev : 'all';
}

function render() {
  updateHeader();
  updateCitySelect();
  const list = document.getElementById('store-list');
  const filtered = getFiltered();
  const grouped = groupByCity(filtered);

  if (grouped.length === 0) {
    list.innerHTML = '<div class="empty">è©²å½ããåºèãããã¾ãã</div>';
    return;
  }

  list.innerHTML = '';
  grouped.forEach(([city, cityStores]) => {
    const allCity = stores.filter(s=>s.city===city);
    const vCity = allCity.filter(s=>s.visited).length;
    const collapsed = collapsedCities[city];

    const sec = document.createElement('div');
    sec.className = 'city-section';

    // å¸çºæãããã¼
    const hdr = document.createElement('div');
    hdr.className = 'city-header' + (collapsed ? ' collapsed' : '');
    hdr.innerHTML = `<span class="chevron">â¼</span><span class="city-name">${city}</span><span class="city-cnt">${vCity}/${allCity.length}</span>`;
    hdr.addEventListener('click', () => {
      collapsedCities[city] = !collapsedCities[city];
      render();
    });
    sec.appendChild(hdr);

    // åºèãªã¹ã
    const ul = document.createElement('div');
    ul.className = 'city-stores' + (collapsed ? ' hidden' : '');
    cityStores.forEach(store => {
      ul.appendChild(createCard(store));
    });
    sec.appendChild(ul);
    list.appendChild(sec);
  });
}

        <button class="edit-cancel" data-cancel="${store.id}">ã­ã£ã³ã»ã«</button>
      </div>
    </div>
  `;

  // ã¤ãã³ã: ãã§ãã¯ãã¿ã³
  card.querySelector('.check-btn').addEventListener('click', () => {
    const s = stores.find(x=>x.id===store.id);
    s.visited = !s.visited;
    if (s.visited && !s.visitDate) s.visitDate = new Date().toISOString().slice(0,10);
    persist();
    render();
  });

  // ã¤ãã³ã: ç·¨éãã¿ã³
  card.querySelector('[data-edit]')?.addEventListener('click', () => {
    const panel = document.getElementById('edit-' + store.id);
    panel.classList.toggle('show');
  });

  // ã¤ãã³ã: ä¿å­
  card.querySelector('[data-save]')?.addEventListener('click', () => {
    const s = stores.find(x=>x.id===store.id);
    s.visitDate = document.getElementById('edate-' + store.id).value;
    s.note = document.getElementById('enote-' + store.id).value;
    persist();
    render();
  });

  // ã¤ãã³ã: ã­ã£ã³ã»ã«
  card.querySelector('[data-cancel]')?.addEventListener('click', () => {
    document.getElementById('edit-' + store.id).classList.remove('show');
  });

  // ã¤ãã³ã: åé¤
  card.querySelector('[data-del]')?.addEventListener('click', () => {
    if (!confirm('ãã®åºèãåé¤ãã¾ããï¼')) return;
    stores = stores.filter(x=>x.id!==store.id);
    persist();
    render();
  });

  return card;
}
